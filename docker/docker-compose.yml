services:
  webhome:
    image: webhome:latest #use port 3002, I do not use "ports", because that doesn't change the container to container port number, only the external port (and we don't want that)
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - web
    volumes:
      - ./dynamic:/app/dynamic
      - ./config:/app/config

# external acces from proxy
networks:
  web:
    name: internal_web
